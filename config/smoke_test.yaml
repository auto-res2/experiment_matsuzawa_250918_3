global_settings:
  seeds: [42]
  device: "cuda:0"
  output_dir: ".research/iteration1/"

acclimate_hparams:
  tau_search_space: [0.05, 0.1]
  k_search_space: [8]
  kappa_max_nll_bound: 0.1
  validation_setup:
    dataset: "ImageNet-C"
    corruption: "shot_noise"
    severity: 3 # Held-out validation shift

experiment_1:
  enabled: true
  models:
    - "nf_resnet50"
  datasets:
    - "ImageNet-C"
  methods:
    - "Source"
    - "ACCLIMATE"
  batch_sizes: [1]

experiment_2:
  enabled: false
  model: "nf_resnet50"
  dataset: "ImageNet-C"
  ablations:
    - "full"
    - "-CSD"

experiment_3:
  enabled: false
  datasets:
    - "CCC"
  baselines:
    - "Source"
    - "ACCLIMATE"
  batch_size: 1
  fps: 30
