description = "Replication of ACCLIMATE paper experiments."
authors = ["AI Researcher"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
torch = "2.1.0"
torchvision = "0.16.0"
transformers = "4.35.0"
timm = "0.9.7"
datasets = "2.15.0"
pyyaml = "6.0.1"
scikit-learn = "1.3.2"
numpy = "1.26.2"
ptflops = "0.7.2"
fvcore = "0.1.5.post20221221"
accelerate = "0.23.0"
matplotlib = "3.8.2"
