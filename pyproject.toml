[project]
name = "acclimate-replication"
version = "0.1.0"
description = "Replication of ACCLIMATE paper experiments."
authors = [{name = "AI Researcher"}]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.35.0",
    "timm>=0.9.7",
    "datasets>=2.15.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.2",
    "numpy>=1.26.2",
    "ptflops>=0.7",
    "fvcore>=0.1.5",
    "accelerate>=0.23.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "tqdm>=4.66.1",
    "requests>=2.31.0",
]

[project.scripts]
run_experiments = "src.main:main"
